[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# Reference contracts use EIP-8141 verbatim opcodes (TXPARAM/FRAMEPARAM/APPROVE).
# They are compile-checked; runtime tests use MockableFrameAccount.
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256
