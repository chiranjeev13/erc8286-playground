[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# The reference contracts use EIP-8141 opcodes (txparam/frameparam/framedatacopy/approve),
# which stock solc does not know, and forge rejects the required "osaka+eip8141" evm_version.
# They are built with Hardhat instead (`npm run compile`); forge skips them.
# Runtime tests use MockableFrameAccount.
skip = ["src/reference/*"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256
